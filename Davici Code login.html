<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水林國中魔法學院 - 達文西登入防線</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-glow: rgba(56, 189, 248, 0.35);
            --primary: #0284c7;
            --primary-glow: #38bdf8;
            --accent: #f59e0b;
            --accent-glow: #fbbf24;
            --error: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b1120 75%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow-x: hidden;
            position: relative;
            perspective: 1200px;
        }

        /* 科技背景粒子與網格 */
        .bg-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9) translate(-20px, -20px); opacity: 0.6; }
            100% { transform: scale(1.15) translate(20px, 20px); opacity: 1; }
        }

        /* 頂部工具列 */
        .top-toolbar {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .tool-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.25);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn:hover {
            color: var(--text-main);
            border-color: var(--primary-glow);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        /* 3D 卡片外層容器 */
        .flip-container {
            width: 100%;
            max-width: 440px;
            height: 600px;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            z-index: 10;
        }

        .flip-container.is-flipped {
            transform: rotateY(180deg);
        }

        /* 卡片共用樣式 */
        .card-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7),
                        0 0 30px rgba(56, 189, 248, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 36px 32px;
            display: flex;
            flex-direction: column;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* 正面：登入介面 */
        .card-front {
            z-index: 2;
            transform: rotateY(0deg);
        }

        /* 反面：密碼學教學看板 */
        .card-back {
            transform: rotateY(180deg);
            background: rgba(15, 23, 42, 0.92);
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7),
                        0 0 30px rgba(245, 158, 11, 0.15);
        }

        /* 學校 Logo ＆ 標題 */
        .school-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge-logo {
            width: 52px;
            height: 52px;
            margin: 0 auto 12px;
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.2), rgba(56, 189, 248, 0.3));
            border: 1px solid var(--primary-glow);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
        }

        .badge-logo svg {
            width: 30px;
            height: 30px;
            stroke: var(--primary-glow);
        }

        .school-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(to right, #ffffff, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .school-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* 表單元素 */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .label-text {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hint-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--primary-glow);
            border: 1px solid rgba(56, 189, 248, 0.3);
            cursor: pointer;
            transition: all 0.2s;
        }

        .hint-badge:hover {
            background: rgba(56, 189, 248, 0.25);
            transform: scale(1.03);
        }

        .input-wrapper {
            position: relative;
        }

        .cyber-input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1.5px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        .cyber-input:focus {
            border-color: var(--primary-glow);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
            background: rgba(15, 23, 42, 0.85);
        }

        .cyber-input::placeholder {
            color: #64748b;
        }

        .input-action-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-action-btn:hover {
            color: var(--text-main);
        }

        /* 密碼下方忘記密碼連結 */
        .forgot-link-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .forgot-link-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 4px;
            padding: 4px 0;
            transition: all 0.2s;
            font-weight: 500;
        }

        .forgot-link-btn:hover {
            color: #7dd3fc;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
        }

        /* 登入按鈕 */
        .login-submit-btn {
            width: 100%;
            height: 50px;
            margin-top: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(2, 132, 199, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px -5px rgba(2, 132, 199, 0.6);
            border-color: var(--primary-glow);
        }

        .login-submit-btn:active {
            transform: translateY(0);
        }

        /* 錯誤晃動動畫 (Shake) */
        @keyframes shakeError {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake-effect {
            animation: shakeError 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        /* 達文西神回覆提示框 */
        .reveal-box {
            margin-top: 20px;
            padding: 16px;
            background: rgba(245, 158, 11, 0.12);
            border: 1.5px solid rgba(245, 158, 11, 0.4);
            border-radius: 14px;
            text-align: center;
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }

        .reveal-box.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .reveal-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-glow);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .reveal-sub {
            font-size: 14px;
            color: #fde68a;
            margin-bottom: 12px;
            font-weight: 600;
            line-height: 1.4;
        }

        .flip-to-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(245, 158, 11, 0.25);
            border: 1px solid var(--accent-glow);
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .flip-to-back-btn:hover {
            background: rgba(245, 158, 11, 0.45);
            transform: scale(1.04);
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.4);
        }

        /* 卡片反面：密碼兩難大考驗 */
        .back-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .back-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-glow);
        }

        .dilemma-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 24px;
        }

        .dilemma-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1.5px solid rgba(239, 68, 68, 0.35);
            border-radius: 16px;
            padding: 16px 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s;
        }

        .dilemma-card:hover {
            transform: translateX(4px);
            background: rgba(30, 41, 59, 0.9);
            border-color: rgba(239, 68, 68, 0.6);
        }

        .dilemma-icon {
            font-size: 28px;
            flex-shrink: 0;
        }

        .dilemma-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dilemma-headline {
            font-size: 16px;
            font-weight: 800;
            color: #f87171;
        }

        .dilemma-consequence {
            font-size: 14px;
            color: #e2e8f0;
            font-weight: 500;
        }

        .dilemma-conclusion {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.15));
            border: 2px dashed var(--accent-glow);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: auto;
        }

        .conclusion-main {
            font-size: 24px;
            font-weight: 900;
            color: #fbbf24;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .conclusion-sub {
            font-size: 13px;
            color: #cbd5e1;
        }

        .flip-back-btn {
            width: 100%;
            height: 42px;
            background: rgba(51, 65, 85, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .flip-back-btn:hover {
            background: rgba(71, 85, 105, 0.9);
            color: #fff;
        }

        /* 快捷鍵小提示 */
        .bottom-hint {
            position: fixed;
            bottom: 16px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            width: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 背景網格與氛圍光芒 -->
    <div class="bg-grid"></div>
    <div class="ambient-glow"></div>

    <!-- 頂部工具列 -->
    <div class="top-toolbar">
        <button class="tool-btn" id="btnAudio" title="切換提示音效">
            <span id="audioIcon">🔊</span> 音效開啟
        </button>
        <button class="tool-btn" id="btnFullscreen" title="進入課堂全螢幕投影">
            ⛶ 全螢幕
        </button>
        <button class="tool-btn" id="btnReset" title="重新重置謎題">
            🔄 重置
        </button>
    </div>

    <!-- 3D 翻轉卡片容器 -->
    <div class="flip-container" id="flipContainer">

        <!-- ================= 正面：達文西登入介面 ================= -->
        <div class="card-face card-front">
            <div class="school-header">
                <div class="badge-logo">
                    <!-- 水林國中倒三角幾何校徽簡約風 -->
                    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 22 2 4 22 4 12 22"></polygon>
                        <path d="M12 6v10M8 8l8 0"></path>
                    </svg>
                </div>
                <h1 class="school-title">水林國中魔法學院</h1>
                <p class="school-subtitle">金鑰之島・數位登入防禦系統 (Authentication Portal)</p>
            </div>

            <form id="loginForm">
                <!-- 第一欄：帳號 (Username) -->
                <div class="form-group">
                    <div class="label-row">
                        <label class="label-text" for="username">
                            <span>👤</span> 帳號 (Username)
                        </label>
                        <span class="hint-badge" id="btnRevealUser">💡 猜猜看我是誰？</span>
                    </div>
                    <div class="input-wrapper">
                        <input type="text" id="username" class="cyber-input" placeholder="請點選右上角提示或點擊輸入" autocomplete="off">
                    </div>
                </div>

                <!-- 第二欄：密碼 (Password) -->
                <div class="form-group">
                    <div class="label-row">
                        <label class="label-text" for="password">
                            <span>🔑</span> 密碼 (Password)
                        </label>
                        <span class="hint-badge" style="cursor: default; opacity: 0.7;">達文西密碼</span>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="cyber-input" placeholder="請輸入達文西密碼..." value="davinci2026!#">
                        <button type="button" class="input-action-btn" id="togglePassword" title="切換密碼顯示">
                            👁️
                        </button>
                    </div>
                    <div class="forgot-link-wrapper">
                        <button type="button" class="forgot-link-btn" id="btnDirectForgot">忘記密碼？ (Forgot password?)</button>
                    </div>
                </div>

                <!-- 登入按鈕 -->
                <button type="submit" class="login-submit-btn" id="submitBtn">
                    <span>⚡ 驗證身分並登入</span>
                </button>

                <!-- 神回覆揭曉區 (第二問：下面是什麼？) -->
                <div class="reveal-box" id="revealBox">
                    <div class="reveal-title">
                        <span>💥 登入失敗！</span>
                    </div>
                    <div class="reveal-sub" id="revealSubText">
                        文西 (DaVinci)，你忘記密碼了嗎？
                    </div>
                    <button type="button" class="flip-to-back-btn" id="btnFlipToBack">
                        <span>📖 忘記密碼？點我看兩難困境 ➔</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- ================= 反面：密碼兩難大考驗 ================= -->
        <div class="card-face card-back">
            <div class="back-header">
                <h2 class="back-title">🤔 密碼的終極考驗</h2>
                <p style="font-size: 13px; color: #cbd5e1; margin-top: 4px;">關於設定密碼，我們總面臨兩個選擇：</p>
            </div>

            <!-- 兩難選項堆疊 -->
            <div class="dilemma-stack">
                <div class="dilemma-card">
                    <div class="dilemma-icon">⚠️</div>
                    <div class="dilemma-content">
                        <div class="dilemma-headline">密碼太簡單</div>
                        <div class="dilemma-consequence">➔ 太容易被別人破解！</div>
                    </div>
                </div>

                <div class="dilemma-card">
                    <div class="dilemma-icon">🤯</div>
                    <div class="dilemma-content">
                        <div class="dilemma-headline">密碼太難</div>
                        <div class="dilemma-consequence">➔ 自己又容易忘記！</div>
                    </div>
                </div>
            </div>

            <!-- 嘆息結尾 -->
            <div class="dilemma-conclusion">
                <div class="conclusion-main">🤷‍♂️ 真是兩難。</div>
                <div class="conclusion-sub">大家到底都用什麼當密碼？讓我們一起看現場文字雲！</div>
            </div>

            <button type="button" class="flip-back-btn" id="btnFlipToFront">
                ↩️ 返回登入測試
            </button>
        </div>

    </div>

    <div class="bottom-hint">
        水林國中資訊科技課堂專用・點擊「提示」或輸入框體驗「達文西雙重梗」
    </div>

    <!-- 互動邏輯與音效合成引擎 (Web Audio API) -->
    <script>
        // 音效引擎（零外部檔案依賴，離線可用）
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playClick() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.05);
            }

            playUnlock() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.16); // G5
                osc.frequency.setValueAtTime(1046.50, this.ctx.currentTime + 0.24); // C6
                gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.35);
            }

            playError() {
                if (!this.enabled) return;
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const sfx = new SoundFX();

        // DOM 元素選取
        const flipContainer = document.getElementById('flipContainer');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const btnRevealUser = document.getElementById('btnRevealUser');
        const togglePassword = document.getElementById('togglePassword');
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const revealBox = document.getElementById('revealBox');
        const btnFlipToBack = document.getElementById('btnFlipToBack');
        const btnDirectForgot = document.getElementById('btnDirectForgot');
        const btnFlipToFront = document.getElementById('btnFlipToFront');
        const btnAudio = document.getElementById('btnAudio');
        const audioIcon = document.getElementById('audioIcon');
        const btnFullscreen = document.getElementById('btnFullscreen');
        const btnReset = document.getElementById('btnReset');

        // 第一問：打字機揭曉「達文西 (DaVinci)」
        let isTyping = false;
        function typeUsername() {
            if (isTyping || usernameInput.value === '達文西 (DaVinci)') return;
            isTyping = true;
            usernameInput.value = '';
            sfx.playUnlock();

            const text = '達文西 (DaVinci)';
            let index = 0;
            const timer = setInterval(() => {
                usernameInput.value += text[index];
                index++;
                if (index >= text.length) {
                    clearInterval(timer);
                    isTyping = false;
                    btnRevealUser.textContent = '✅ 已鎖定達文西帳號！';
                    btnRevealUser.style.borderColor = 'rgba(74, 222, 128, 0.5)';
                    btnRevealUser.style.color = '#4ade80';
                }
            }, 60);
        }

        btnRevealUser.addEventListener('click', typeUsername);
        usernameInput.addEventListener('click', typeUsername);

        // 密碼眼睛顯示/隱藏切換
        togglePassword.addEventListener('click', () => {
            sfx.playClick();
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.textContent = '🔒';
            } else {
                passwordInput.type = 'password';
                togglePassword.textContent = '👁️';
            }
        });

        // 第二問：送出登入 ➔ 左右晃動錯誤 ➔ 彈出「文西，你忘記密碼了嗎？」
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // 按鈕微光載入態
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.7';
            submitBtn.innerHTML = '<span>⏳ 驗證中...</span>';

            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
                submitBtn.innerHTML = '<span>⚡ 驗證身分並登入</span>';

                // 播放錯誤震動音效與晃動動畫
                sfx.playError();
                flipContainer.classList.add('shake-effect');
                setTimeout(() => {
                    flipContainer.classList.remove('shake-effect');
                }, 500);

                // 彈出神回覆
                revealBox.classList.add('show');
            }, 400);
        });

        // 3D 翻轉卡片
        btnFlipToBack.addEventListener('click', () => {
            sfx.playUnlock();
            flipContainer.classList.add('is-flipped');
        });

        if (btnDirectForgot) {
            btnDirectForgot.addEventListener('click', () => {
                sfx.playUnlock();
                flipContainer.classList.add('is-flipped');
            });
        }

        btnFlipToFront.addEventListener('click', () => {
            sfx.playClick();
            flipContainer.classList.remove('is-flipped');
        });

        // 工具列功能：音效開關
        btnAudio.addEventListener('click', () => {
            sfx.enabled = !sfx.enabled;
            audioIcon.textContent = sfx.enabled ? '🔊' : '🔇';
            btnAudio.childNodes[2].textContent = sfx.enabled ? ' 音效開啟' : ' 音效關閉';
            if (sfx.enabled) sfx.playClick();
        });

        // 工具列功能：全螢幕
        btnFullscreen.addEventListener('click', () => {
            sfx.playClick();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
                btnFullscreen.textContent = '🗗 縮小';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    btnFullscreen.textContent = '⛶ 全螢幕';
                }
            }
        });

        // 工具列功能：重置
        btnReset.addEventListener('click', () => {
            sfx.playClick();
            flipContainer.classList.remove('is-flipped');
            usernameInput.value = '';
            passwordInput.value = 'davinci2026!#';
            passwordInput.type = 'password';
            togglePassword.textContent = '👁️';
            revealBox.classList.remove('show');
            btnRevealUser.textContent = '💡 猜猜看我是誰？';
            btnRevealUser.style.borderColor = 'rgba(56, 189, 248, 0.3)';
            btnRevealUser.style.color = 'var(--primary-glow)';
        });
    </script>
</body>
</html>
